services:
  - type: web
    name: planner
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install && npx prisma generate
    startCommand: cd server && npx prisma migrate deploy && node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: planner-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: planner-db
    plan: free
    databaseName: planner
